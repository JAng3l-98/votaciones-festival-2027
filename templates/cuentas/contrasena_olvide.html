{% extends "base.html" %}

{% block titulo %}Recuperar contraseña{% endblock %}

{% block contenido %}
<section class="seccion">
  <div class="container">
    <div class="row justify-content-center"><div class="col-md-8 col-lg-5">
      <h1>¿Olvidaste tu contraseña?</h1>
      <p class="lead mt-2">Escribe el correo de tu cuenta y te enviamos un enlace para crear una nueva.</p>
      <form method="post" class="mt-4" novalidate>
        {% csrf_token %}
        {% include "cuentas/_campos.html" %}
        <button class="btn btn-primary w-100 mt-2" type="submit">Enviar enlace</button>
      </form>
      <p class="mt-4"><a class="fw-bold" href="{% url 'cuentas:login' %}">Volver a ingresar</a></p>
    </div></div>
  </div>
</section>
{% endblock %}
